name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,train]" ruff
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest -q
      - name: Examples
        run: |
          python examples/streaming_grpo.py
          python examples/streaming_opd.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and run the examples
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -I "$GITHUB_WORKSPACE/examples/streaming_grpo.py"
          cd /tmp && /tmp/wheel-env/bin/python -I "$GITHUB_WORKSPACE/examples/streaming_opd.py"
